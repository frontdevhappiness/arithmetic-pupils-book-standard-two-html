    .pg144-grid {
      display: grid;
      grid-template-columns: 44% 56%;
      grid-template-rows: repeat(2, 10.55rem);
      margin: 0;
      border: .11rem solid var(--pg144-grid);

    .pg144-cell {

    .pg144-continuation { display: block; margin-left: 3rem; }

      display: grid;
      place-items: center;
      position: absolute;
      left: 50%;
      bottom: 3rem;
      width: 5.2rem;
      aspect-ratio: 1.65 / 1;
      margin: 0;
      border-radius: 50%;
      background: #00a9e8;
      color: #fff;
      font-size: 1.75rem;
      font-weight: 900;
      line-height: 1;
      text-align: center;
      transform: translateX(-50%);
      -webkit-text-stroke: .015em currentColor;
    }

    .sr-only {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important;

      .pg144-grid { grid-template-rows: repeat(2, clamp(6.5rem, 26vw, 10.55rem)); }
      .pg144-cell {
        padding: clamp(.25rem, 1.2vw, .42rem) clamp(.35rem, 2vw, .82rem);
        font-size: clamp(1.05rem, 4vw, 1.86rem);
